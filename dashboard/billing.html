<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تفعيل المنصة — جواب</title>
  <style>
    body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f9f9fb;color:#14213d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:48px 36px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(20,33,61,.08)}
    .icon{font-size:64px;margin-bottom:18px}
    h1{margin:0 0 12px;font-size:24px;font-weight:900;color:#1a1a1a}
    .desc{color:#64748b;line-height:1.9;font-size:14px;margin-bottom:28px}
    .code-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:20px;margin-bottom:20px}
    .code-box label{display:block;font-size:13px;color:#15803d;font-weight:700;margin-bottom:10px}
    .code-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    input{border-radius:10px;border:1px solid #e5e7eb;padding:12px 14px;font:inherit;flex:1;min-width:180px;max-width:240px;direction:ltr;text-align:center;font-size:16px}
    input:focus{outline:none;border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.12)}
    button{border-radius:10px;border:1px solid #e5e7eb;padding:12px 20px;font:inherit;cursor:pointer;font-weight:800;background:#1a1a1a;color:#fff;transition:all .18s}
    button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,26,26,.15)}
    .ghost{background:#fff;color:#1a1a1a;font-weight:700}
    .ghost:hover{background:#f8fafc}
    .status{padding:12px;border-radius:10px;margin-top:14px;font-size:13px;line-height:1.7;display:none}
    .status.show{display:block}
    .status.err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
    .status.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
    .links{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📞</div>
    <h1>المنصة تحتاج تفعيل</h1>
    <p class="desc">لاستخدام منصة جواب، تواصل مع خدمة العملاء للحصول على كود التفعيل ومعرفة تفاصيل الاشتراك.</p>

    <div class="code-box">
      <label>عندك كود تفعيل؟</label>
      <div class="code-row">
        <input id="code" placeholder="أدخل الكود هنا">
        <button onclick="applyCode()">تفعيل</button>
      </div>
    </div>

    <div class="status" id="message"></div>

    <div class="links">
      <button class="ghost" onclick="location.href='/login'">تغيير الحساب</button>
    </div>
  </div>

<script>
async function init(){
  const qs=new URLSearchParams(location.search);
  const r=await fetch('/api/billing/state');
  if(r.status===401){location.href='/login';return}
  const d=await r.json();
  if(d.state?.accessActive){location.href='/';return}
}
function showMessage(text,err=false){
  const el=document.getElementById('message');
  el.textContent=text;
  el.className='status show'+(err?' err':' ok');
}
async function applyCode(){
  const code=document.getElementById('code').value.trim();
  if(!code){showMessage('اكتب كود التفعيل',true);return}
  const r=await fetch('/api/billing/activate-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  const d=await r.json();
  if(d.success){location.href='/'}
  else showMessage(d.message||'كود التفعيل غير صحيح',true);
}
init().catch(()=>showMessage('تعذر تحميل الصفحة',true));
</script>
</body>
</html>
