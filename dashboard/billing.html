<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تفعيل المنصة — جواب</title>
  <link rel="stylesheet" href="/fatima-font.css">
  <style>
    body{margin:0;font-family:'Fatima',Tahoma,Arial,sans-serif;background:#f9f9fb;color:#14213d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:48px 36px;max-width:480px;width:100%;text-align:center;box-shadow:0 4px 16px rgba(15,23,42,.04)}
    .icon{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;font-size:24px;margin-bottom:18px;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;border-radius:12px}
    .icon i[data-lucide]{width:24px;height:24px;color:#15803d;stroke-width:1.5}
    h1{margin:0 0 12px;font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#1a1a1a}
    .desc{color:#64748b;line-height:1.75;font-size:13px;margin-bottom:28px}
    .code-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:20px;margin-bottom:20px}
    .code-box label{display:block;font-size:13px;color:#15803d;font-weight:700;margin-bottom:10px}
    .code-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    input{border-radius:9px;border:1.5px solid #e5e7eb;padding:12px 14px;font:inherit;flex:1;min-width:180px;max-width:240px;direction:ltr;text-align:center;font-size:14px}
    input:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 3px #f0fdf4}
    button{border-radius:9px;border:1px solid #e5e7eb;padding:10px 20px;font:inherit;cursor:pointer;font-weight:600;font-size:13.5px;background:#16a34a;color:#fff;transition:all .18s}
    button:hover{background:#15803d}
    .ghost{background:#fff;color:#1a1a1a;border:1px solid #e5e7eb;font-weight:600}
    .ghost:hover{background:#f8fafc}
    .status{padding:12px;border-radius:9px;margin-top:14px;font-size:12.5px;line-height:1.7;display:none}
    .status.show{display:block}
    .status.err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
    .status.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
    .links{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="icon"><i data-lucide="badge-check"></i></div>
    <h1>المنصة تحتاج تفعيل</h1>
    <p class="desc">لاستخدام منصة جواب، تواصل مع خدمة العملاء للحصول على كود التفعيل ومعرفة تفاصيل الاشتراك.</p>

    <div class="code-box">
      <label>عندك كود تفعيل؟</label>
      <div class="code-row">
        <input id="code" placeholder="أدخل الكود هنا">
        <button onclick="applyCode()">تفعيل</button>
      </div>
    </div>

    <div class="status" id="message"></div>

    <div class="links">
      <button class="ghost" onclick="location.href='/login'">تغيير الحساب</button>
    </div>
  </div>

<script>
async function init(){
  const qs=new URLSearchParams(location.search);
  const r=await fetch('/api/billing/state');
  if(r.status===401){location.href='/login';return}
  const d=await r.json();
  if(d.state?.accessActive){location.href='/';return}
}
function showMessage(text,err=false){
  const el=document.getElementById('message');
  el.textContent=text;
  el.className='status show'+(err?' err':' ok');
}
async function applyCode(){
  const code=document.getElementById('code').value.trim();
  if(!code){showMessage('اكتب كود التفعيل',true);return}
  const r=await fetch('/api/billing/activate-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  const d=await r.json();
  if(d.success){location.href='/'}
  else showMessage(d.message||'كود التفعيل غير صحيح',true);
}
init().catch(()=>showMessage('تعذر تحميل الصفحة',true));
if(window.lucide)lucide.createIcons({attrs:{'stroke-width':1.5}});
</script>
</body>
</html>
