name: CI

# بوابة الأمان (المرحلة 0): تشغّل كل الاختبارات على كل push و pull request.
# لو فشل أي اختبار، الفحص يفشل — ومع تفعيل حماية الفرع (branch protection)
# على production يصير مستحيل يُدمج/يُنشر كود مكسور.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          # قيم وهمية تضمن أن الاختبارات لا تصل أبداً لقاعدة بيانات أو Redis
          # حقيقية. السويت أصلاً مكتفٍ ذاتياً (mocks + فحص ثابت)، فهذي طبقة
          # حماية إضافية (defense-in-depth) فقط.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          REDIS_URL: redis://127.0.0.1:1
          NODE_ENV: test
